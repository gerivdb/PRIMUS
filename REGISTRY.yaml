---
name: PRIMUS
version: "1.0.0"
description: Registre des primitives de l'écosystème gerivdb
strate: L4
priority: P1
primitives:
  - name: registry-loader
    version: "1.0.0"
    type: executor
    strate: L4
    priority: P1
    input:
      registry_path:
        type: string
        description: "Chemin vers REGISTRY.yaml ou répertoire primitives/"
      validate:
        type: boolean
        default: true
        description: "Valider les schémas après chargement"
    output:
      loaded_count:
        type: int
        description: "Nombre de primitives chargées"
      registry:
        type: object
        description: "Registre indexé {name: primitive}"
      errors:
        type: list
        description: "Liste des erreurs de chargement"
    tools:
      - workflow-anything
      - cli-anything
  - name: repo-tree-parser
    version: "1.0.0"
    type: parser
    strate: L4
    priority: P1
    input:
      repo_path:
        type: string
        description: "Chemin vers la racine du dépôt"
      include_hidden:
        type: boolean
        default: false
    output:
      tree:
        type: object
        description: "Arborescence du dépôt"
      file_count:
        type: int
    tools:
      - workflow-anything
  - name: json-schema-validator
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      schema_path:
        type: string
      data:
        type: object
    output:
      valid:
        type: boolean
      errors:
        type: list
    tools:
      - cli-anything
  - name: frontmatter-intent-validator
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      file_path:
        type: string
      intent_hash:
        type: string
    output:
      valid:
        type: boolean
      errors:
        type: list
    tools:
      - cli-anything
  - name: intent-hash-generator
    version: "1.0.0"
    type: transformer
    strate: L4
    priority: P1
    input:
      context:
        type: string
      date:
        type: string
    output:
      intent_hash:
        type: string
    tools:
      - cli-anything
  - name: phi-calc
    version: "1.0.0"
    type: calculator
    strate: L4
    priority: P1
    input:
      numerator:
        type: number
      denominator:
        type: number
    output:
      phi:
        type: number
    tools:
      - workflow-anything
  - name: workflow-runner
    version: "1.0.0"
    type: executor
    strate: L4
    priority: P1
    input:
      workflow_path:
        type: string
      dry_run:
        type: boolean
        default: false
    output:
      status:
        type: string
      steps_executed:
        type: int
    tools:
      - workflow-anything
  - name: dag-query
    version: "1.0.0"
    type: query
    strate: L4
    priority: P1
    input:
      dag_path:
        type: string
      query:
        type: string
    output:
      result:
        type: object
    tools:
      - workflow-anything
  - name: gitignore-audit
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      repo_root:
        type: string
        description: "Chemin vers la racine du dépôt git"
    output:
      ignored_count:
        type: int
      staged_count:
        type: int
      conflict_count:
        type: int
      error:
        type: string
        nullable: true
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/tools/gitignore-audit.py
  - name: mcp-scope-check
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      path:
        type: string
        description: "Chemin à vérifier"
    output:
      path:
        type: string
      exists:
        type: boolean
      mcp_scope:
        type: boolean
      shell_scope:
        type: boolean
      recommended_tool:
        type: string
    tools:
      - workflow-anything
  - name: tool-schema-validator
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      tools:
        type: array
        items:
          type: object
      schema:
        type: object
        nullable: true
    output:
      valid:
        type: boolean
      valid_count:
        type: int
      invalid_count:
        type: int
      errors:
        type: list
    tools:
      - workflow-anything
  - name: yaml-editor
    version: "1.0.0"
    type: validator
    strate: L4
    priority: P1
    input:
      path:
        type: string
      data:
        type: object
    output:
      path:
        type: string
      bytes_written:
        type: int
      error:
        type: string
        nullable: true
    tools:
      - workflow-anything
  - name: confidence
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      probabilities:
        type: array
        items:
          type: number
    output:
      confidence:
        type: number
        minimum: 0
        maximum: 1
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: normalize-distribution
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      probabilities:
        type: array
        items:
          type: number
    output:
      normalized:
        type: array
        items:
          type: number
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: extract-json
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      text:
        type: string
    output:
      json:
        type: object
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: prepare-questions
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      questions:
        type: object
        additionalProperties:
          type: object
    output:
      prepared:
        type: array
        items:
          type: object
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: build-output-schema
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      questions:
        type: array
        items:
          type: object
    output:
      schema:
        type: object
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: decode-answers
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      raw:
        type: object
      questions:
        type: array
        items:
          type: object
    output:
      answers:
        type: object
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: validate-system-one-request
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      request:
        type: object
    output:
      valid:
        type: boolean
      error_count:
        type: int
      errors:
        type: list
    tools:
      - workflow-anything
    source_repo: gerivdb/localjev-upstream
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/localjev-upstream/src/engine.ts
  - name: benchmark-latency
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      url:
        type: string
      runs:
        type: int
        default: 10
      payload:
        type: object
        nullable: true
      timeout:
        type: number
        default: 10.0
    output:
      avg_ms:
        type: number
      median_ms:
        type: number
      min_ms:
        type: number
      max_ms:
        type: number
      error:
        type: string
        nullable: true
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/benchmark_latency.py
  - name: entropy-monitor
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      probabilities:
        type: array
        items:
          type: number
    output:
      entropy:
        type: number
      normalized_entropy:
        type: number
      max_entropy:
        type: number
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/entropy_monitor.py
  - name: generate-validation-report
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      results:
        type: array
        items:
          type: object
    output:
      summary:
        type: object
      details:
        type: array
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/generate_validation_report.py
  - name: integration-score
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      contract_score:
        type: number
      matrix_score:
        type: number
      crosslink_score:
        type: number
    output:
      overall:
        type: number
      status:
        type: string
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/integration_score.py
  - name: model-selector
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      models:
        type: array
        items:
          type: object
      min_size_mb:
        type: int
        default: 0
    output:
      best_model:
        type: string
        nullable: true
      best_size_mb:
        type: number
      all_candidates:
        type: array
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/model_selector.py
  - name: service-lifecycle
    version: "1.0.0"
    type: logic
    strate: L4
    priority: P1
    input:
      services:
        type: array
        items:
          type: object
    output:
      valid:
        type: boolean
      error_count:
        type: int
      errors:
        type: list
    tools:
      - workflow-anything
    source_repo: gerivdb/JEVX
    reference_impl: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX/scripts/service_lifecycle.py
